name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test

      - name: Save coverage report
        run: |
          mkdir -p coverage
          cp -R ./coverage ./

      - name: Upload coverage as artifact
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/
