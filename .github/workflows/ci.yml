name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Validate outdated dependencies
        run: npm outdated || echo "No outdated dependencies"

      - name: Run npm audit
        run: npm audit --production --audit-level=moderate || echo "Audit completed with issues"

      - name: Run tests with coverage
        run: npm run test

      - name: Save coverage report
        run: |
          mkdir -p coverage
          cp -R ./coverage ./

      - name: Upload coverage as artifact
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/
